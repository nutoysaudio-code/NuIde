[package]
name = "nuide"
version = "0.3.5"
edition = "2021"
description = "NuIde — IDE multi-lenguaje"

# Proyecto independiente: no forma parte del workspace de audio NuToys. Declara
# su propio workspace para poder compilarse solo, incluso viviendo dentro de
# otra carpeta de trabajo. `nucoder/` es un crate aparte (su propio workspace);
# se enlaza por path como dependencia (núcleo compartido del agente).
[workspace]
exclude = ["nucoder"]

[lib]
name = "nuide"
path = "src/lib.rs"

[[bin]]
name = "nuide"
path = "src/main.rs"

[dependencies]
# Portapapeles del sistema para copiar/cortar/pegar en el editor. Sólo texto:
# sin las features de imagen, que arrastran tiff/image de más.
arboard = { version = "3.6.1", default-features = false }
# Terminal real: PTY (ConPTY en Windows) + emulador VT.
portable-pty = "0.9.0"
vt100 = "0.16.2"
# Búsqueda con expresiones regulares en el editor. `regex-lite` es la variante
# liviana (sin tablas Unicode) pensada para casos simples como éste.
regex-lite = "0.1"
# JSON para leer/escribir la config de NuCoder (proveedores).
serde_json = "1.0"
# Diálogo nativo de carpetas para elegir el proyecto.
rfd = "0.17.2"
slint = "1.0"
# Núcleo de NuCoder (router + config + agente + herramientas), compartido con el
# CLI `nucoder`. UI-agnóstico: el panel de chat se dibuja acá, en Slint.
nucoder = { path = "nucoder" }

[build-dependencies]
slint-build = "1.0"
# Compila el C generado por el toolchain de SpASM (`spasm/generated/` vía los
# wrappers de `spasm/ffi/`) y lo deja enlazado al binario en `build.rs`.
cc = "1"

# `release`: binario optimizado y chico para empaquetar.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
