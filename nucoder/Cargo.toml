[package]
name = "nucoder"
version = "0.3.7"
edition = "2021"
description = "NuCoder - agente de codigo con router de modelos (SpASM)"
# Hay dos binarios (`nucoder` y el fixture de tests `mcp_stub`): fijamos el default.
default-run = "nucoder"

# Proyecto independiente: no forma parte del workspace de NuIde
[workspace]

# El núcleo (router, config, agente, herramientas) es una **librería** que
# consume tanto el CLI `nucoder` como el panel nativo de NuIde. Sin dependencias
# de UI: la interfaz de chat vive en NuIde (Slint).
[lib]
name = "nucoder"
path = "src/lib.rs"

[dependencies]
# Config + JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Anyhow + dirs
anyhow = "1.0"
dirs = "5.0"

# Persistencia en SQLite (config, chats, recetario). `bundled` compila SQLite en
# C: no depende del sistema y es el único camino serio para guardar de verdad en
# SQLite sin implementar el formato a mano.
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"