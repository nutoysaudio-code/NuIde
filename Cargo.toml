[package]
name = "nuide"
version = "0.1.0"
edition = "2021"
description = "NuIde — IDE para SpASM con terminales integrados y OpenCode CLI"

# Proyecto independiente: no forma parte del workspace de audio NuToys. Declara
# su propio workspace para poder compilarse solo, incluso viviendo dentro de
# otra carpeta de trabajo.
[workspace]

[lib]
name = "nuide"
path = "src/lib.rs"

[[bin]]
name = "nuide"
path = "src/main.rs"

[dependencies]
# Portapapeles del sistema para copiar/cortar/pegar en el editor. Sólo texto:
# sin las features de imagen, que arrastran tiff/image de más.
arboard = { version = "3.6.1", default-features = false }
portable-pty = "0.9.0"
slint = "1.0"
vt100 = "0.16.2"

[build-dependencies]
slint-build = "1.0"
